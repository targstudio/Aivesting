<title>Meta 76</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');

  :root{
    --bg:#F3F5F1;
    --surface:#FFFFFF;
    --surface-soft:#EFF2ED;
    --ink:#15241C;
    --ink-dim:#637264;
    --ink-faint:#9AA79B;
    --primary:#0C5B52;
    --primary-dark:#083F39;
    --primary-soft:#E2EFE9;
    --mint:#D8F3E6;
    --mint-ink:#0C5B52;
    --lime:#CFEB5A;
    --lime-dark:#8FB233;
    --amber:#F2A93C;
    --amber-soft:#FCEED7;
    --red:#E85A5A;
    --red-soft:#FBE4E2;
    --line:#E4E8E1;
    --shadow: 0 2px 10px rgba(16,36,27,.05), 0 10px 28px -16px rgba(16,36,27,.14);
  }
  *{ box-sizing:border-box; }
  html,body{ height:auto; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Nunito',system-ui,sans-serif;
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{ margin:0; font-weight:800; }
  button{ font-family:inherit; }
  input,select,textarea{ font-family:inherit; }
  .tabular{ font-variant-numeric:tabular-nums; }

  #app{ max-width:560px; margin:0 auto; padding:20px 18px 110px; }

  .greeting{ display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:18px; }
  .greeting .hi{ font-size:15px; color:var(--ink-dim); font-weight:600; }
  .greeting h1{ font-size:27px; color:var(--primary); line-height:1.1; margin-top:2px; }
  .icon-circle{ width:46px; height:46px; border-radius:50%; background:var(--surface); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--primary); flex:none; cursor:pointer; box-shadow:var(--shadow); }
  .icon-circle svg{ width:20px; height:20px; }

  /* ---- banner ---- */
  .banner{
    position:relative; overflow:hidden;
    background:linear-gradient(160deg,var(--primary),var(--primary-dark));
    border-radius:28px; padding:24px 22px 22px; margin-bottom:22px; color:#fff;
  }
  .banner .wave{ position:absolute; right:-10px; top:-10px; width:160px; height:160px; opacity:.55; }
  .banner .eyebrow{ font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--lime); position:relative; }
  .banner h2{ font-size:21px; color:#fff; margin-top:6px; position:relative; max-width:80%; line-height:1.25; }
  .banner .chips{ display:flex; gap:10px; margin-top:18px; position:relative; flex-wrap:wrap; }
  .banner .chip{ background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.22); border-radius:16px; padding:10px 14px; flex:1; min-width:128px; }
  .banner .chip .l{ font-size:10.5px; color:rgba(255,255,255,.75); font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
  .banner .chip .v{ font-size:17px; font-weight:800; color:#fff; margin-top:2px; }
  .banner .chip .v span{ font-size:12px; font-weight:700; color:var(--lime); }

  /* ---- section title ---- */
  .section-title{ display:flex; align-items:center; justify-content:space-between; margin:0 2px 12px; }
  .section-title h2{ font-size:19px; color:var(--ink); }
  .section-title a, .link-btn{ color:var(--primary); font-size:13.5px; font-weight:700; background:none; border:none; cursor:pointer; padding:0; }

  /* ---- status cards (home summary) ---- */
  .status-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:24px; }
  .status-card{ background:var(--surface); border-radius:22px; padding:18px; box-shadow:var(--shadow); }
  .status-card .avatar{ width:42px; height:42px; border-radius:50%; background:var(--mint); color:var(--mint-ink); display:flex; align-items:center; justify-content:center; margin-bottom:12px; }
  .status-card .avatar svg{ width:20px; height:20px; }
  .status-card .pill{ display:inline-block; font-size:11px; font-weight:800; padding:4px 10px; border-radius:99px; margin-bottom:10px; }
  .status-card .pill.ok{ background:var(--mint); color:var(--mint-ink); }
  .status-card .pill.warn{ background:var(--amber-soft); color:#9A6414; }
  .status-card .pill.bad{ background:var(--red-soft); color:#A32E2E; }
  .status-card .title{ font-size:15px; font-weight:800; color:var(--ink); }
  .status-card .sub{ font-size:12.5px; color:var(--ink-dim); margin-top:3px; line-height:1.4; }
  .status-card .more{ display:flex; align-items:center; gap:4px; color:var(--primary); font-weight:800; font-size:12.5px; margin-top:12px; }

  /* ---- shortcuts ---- */
  .shortcut-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:26px; }
  .shortcut{ background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:8px; cursor:pointer; padding:0; }
  .shortcut .box{ width:100%; aspect-ratio:1; border-radius:18px; background:var(--surface-soft); display:flex; align-items:center; justify-content:center; color:var(--primary); }
  .shortcut .box svg{ width:24px; height:24px; }
  .shortcut .lbl{ font-size:11.5px; font-weight:700; color:var(--ink); text-align:center; line-height:1.25; }

  /* ---- generic card ---- */
  .card{ background:var(--surface); border-radius:22px; padding:20px; margin-bottom:16px; box-shadow:var(--shadow); }
  .card h2.card-title{ font-size:18px; color:var(--ink); margin-bottom:4px; }
  .card .sub{ font-size:13px; color:var(--ink-dim); margin:2px 0 16px; line-height:1.5; }
  .card .sub:last-child{ margin-bottom:0; }
  .card-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }

  .pill{ display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:800; padding:5px 12px; border-radius:99px; white-space:nowrap; }
  .pill.ok{ background:var(--mint); color:var(--mint-ink); }
  .pill.warn{ background:var(--amber-soft); color:#9A6414; }
  .pill.bad{ background:var(--red-soft); color:#A32E2E; }
  .pill.neutral{ background:var(--primary-soft); color:var(--primary); }

  /* ---- ring + macros (nutrição) ---- */
  .hero{ display:flex; gap:20px; align-items:center; }
  .ring-wrap{ position:relative; flex:none; width:122px; height:122px; }
  .ring-wrap svg{ width:100%; height:100%; transform:rotate(-90deg); }
  .ring-bg{ fill:none; stroke:var(--surface-soft); stroke-width:12; }
  .ring-fg{ fill:none; stroke:var(--primary); stroke-width:12; stroke-linecap:round; transition:stroke-dasharray .4s; }
  .ring-fg.over{ stroke:var(--amber); }
  .ring-center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .ring-center .n{ font-size:23px; font-weight:800; color:var(--ink); }
  .ring-center .u{ font-size:10px; color:var(--ink-dim); margin-top:2px; font-weight:700; }
  .hero-side{ flex:1; min-width:0; display:flex; flex-direction:column; gap:9px; }
  .hero-side .row{ display:flex; justify-content:space-between; font-size:13px; }
  .hero-side .row .l{ color:var(--ink-dim); }
  .hero-side .row .v{ font-weight:800; color:var(--ink); }

  .macro{ margin-top:18px; }
  .macro-row{ display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .macro-dot{ width:9px; height:9px; border-radius:50%; flex:none; }
  .macro-row .l{ flex:1; color:var(--ink-dim); font-weight:700; font-size:12.5px; }
  .macro-row .v{ font-weight:800; color:var(--ink); font-size:12px; }
  .macro-track{ height:8px; border-radius:99px; background:var(--surface-soft); overflow:hidden; margin-bottom:14px; }
  .macro-fill{ height:100%; border-radius:99px; display:block; }

  /* ---- buttons ---- */
  .btn{ border:none; border-radius:14px; padding:13px 18px; font-size:14px; font-weight:800; cursor:pointer; }
  .btn.primary{ background:var(--primary); color:#fff; }
  .btn.ghost{ background:var(--surface-soft); color:var(--primary); }
  .btn.block{ width:100%; }
  .btn.tiny{ padding:8px 12px; font-size:12.5px; border-radius:11px; }
  .btn:disabled{ opacity:.45; cursor:default; }

  /* ---- meal rows ---- */
  .meal-row{ padding:14px 0; border-bottom:1px solid var(--line); }
  .meal-row:last-child{ border-bottom:none; padding-bottom:0; }
  .meal-row .top{ display:flex; align-items:center; gap:10px; }
  .meal-row .info{ flex:1; min-width:0; }
  .meal-row .name{ font-weight:800; font-size:14.5px; color:var(--ink); }
  .meal-row .items{ font-size:12px; color:var(--ink-dim); margin-top:1px; }
  .meal-row .kcal{ flex:none; font-weight:800; font-size:13px; color:var(--ink); }
  .meal-actions{ display:flex; gap:6px; margin-top:10px; }
  .pill-btn{ flex:1; display:flex; align-items:center; justify-content:center; gap:5px; border:1px solid var(--line); background:var(--surface); color:var(--ink-dim); font-weight:800; font-size:12px; padding:9px; border-radius:13px; cursor:pointer; }
  .pill-btn svg{ width:14px; height:14px; }
  .pill-btn.plan.active{ background:var(--amber-soft); border-color:var(--amber-soft); color:#9A6414; }
  .pill-btn.eat.active{ background:var(--mint); border-color:var(--mint); color:var(--mint-ink); }
  .edit-link{ background:none; border:none; color:var(--primary); font-size:12px; font-weight:800; cursor:pointer; padding:0; margin-top:8px; }

  /* ---- editable item table (clean) ---- */
  .items-edit{ margin-top:10px; background:var(--surface-soft); border-radius:14px; padding:12px; }
  .item-edit-row{ display:grid; grid-template-columns:1.6fr .9fr .6fr .5fr .5fr .5fr auto; gap:6px; margin-bottom:6px; align-items:center; }
  .item-edit-row input{ background:#fff; border:1px solid var(--line); border-radius:8px; padding:6px 7px; font-size:11.5px; width:100%; }
  .item-rm{ background:none; border:none; color:var(--ink-faint); cursor:pointer; font-size:14px; }

  /* ---- food picker ---- */
  .food-picker{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:4px; }
  .food-picker select{ flex:1 1 150px; }
  .food-picker input[type=number]{ width:70px; flex:none; }
  .food-picker .preview{ font-size:12px; font-weight:800; color:var(--primary); flex:none; }

  .entry-row{ display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); font-size:13px; }
  .entry-row:last-child{ border-bottom:none; }
  .entry-row .name{ font-weight:700; color:var(--ink); }
  .entry-row .macros{ font-size:11.5px; color:var(--ink-dim); }
  .entry-row .right{ display:flex; align-items:center; gap:10px; }
  .icon-btn{ background:none; border:none; color:var(--ink-faint); cursor:pointer; font-size:16px; padding:2px; }

  /* ---- forms / inputs ---- */
  input[type=number], input[type=text], select{
    background:var(--surface-soft); border:1px solid var(--line); color:var(--ink); border-radius:12px; padding:11px 13px; font-size:14px; width:100%;
  }
  input:focus, select:focus, button:focus-visible{ outline:2px solid var(--primary); outline-offset:1px; }
  .field-row{ display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
  .field-row:last-child{ margin-bottom:0; }
  .field-row label{ font-size:12.5px; font-weight:700; color:var(--ink-dim); }

  .stat-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:16px; }
  .stat-tile{ background:var(--surface-soft); border-radius:16px; padding:12px 13px; }
  .stat-tile .l{ font-size:10.5px; color:var(--ink-dim); font-weight:800; text-transform:uppercase; letter-spacing:.02em; }
  .stat-tile .v{ font-size:17px; font-weight:800; margin-top:3px; color:var(--ink); }

  .progress-track{ height:10px; border-radius:99px; background:var(--surface-soft); overflow:hidden; margin:6px 0 8px; }
  .progress-fill{ height:100%; border-radius:99px; background:linear-gradient(90deg,var(--primary),var(--lime-dark)); display:block; }
  .progress-caption{ display:flex; justify-content:space-between; font-size:12px; color:var(--ink-dim); }

  /* ---- workout ---- */
  .day-row{ display:flex; align-items:center; gap:12px; padding:13px 0; border-bottom:1px solid var(--line); cursor:pointer; }
  .day-row:last-child{ border-bottom:none; }
  .day-chip{ width:44px; height:44px; border-radius:14px; background:var(--surface-soft); display:flex; flex-direction:column; align-items:center; justify-content:center; flex:none; font-weight:800; }
  .day-chip .d{ font-size:12px; color:var(--ink); line-height:1; }
  .day-chip.today{ background:var(--primary); }
  .day-chip.today .d{ color:#fff; }
  .day-chip.done{ background:var(--mint); }
  .day-chip.done .d{ color:var(--mint-ink); }
  .day-info{ flex:1; min-width:0; }
  .day-info .muscle{ font-weight:800; font-size:14px; color:var(--ink); }
  .day-info .count{ font-size:12px; color:var(--ink-dim); margin-top:1px; }
  .chev{ color:var(--ink-faint); flex:none; }
  .exercise-list{ margin-top:4px; padding-top:4px; }
  .exercise-row{ display:flex; justify-content:space-between; padding:8px 0; border-top:1px dashed var(--line); font-size:13px; }
  .exercise-row:first-child{ border-top:none; }
  .exercise-row .ex-name{ color:var(--ink); font-weight:700; }
  .exercise-row .ex-sets{ color:var(--ink-dim); font-weight:700; text-align:right; flex:none; margin-left:10px; }
  .day-note{ background:var(--primary-soft); color:var(--primary-dark); border-radius:14px; padding:10px 12px; font-size:12.5px; line-height:1.45; margin-bottom:6px; }

  /* ---- foto do prato ---- */
  .photo-btn{ display:flex; align-items:center; justify-content:center; gap:8px; width:100%; background:var(--primary); color:#fff; border-radius:14px; padding:14px; font-weight:800; font-size:14px; cursor:pointer; }
  .photo-btn svg{ width:20px; height:20px; }
  .photo-btn.disabled{ opacity:.45; pointer-events:none; }
  .photo-input{ position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; }
  .photo-preview{ width:100%; max-height:240px; object-fit:cover; border-radius:16px; margin-top:14px; display:block; }
  .photo-status{ font-size:13px; color:var(--ink-dim); margin-top:12px; text-align:center; }
  .photo-status.error{ color:#A32E2E; }
  .photo-result{ margin-top:14px; }
  .photo-total{ display:flex; justify-content:space-between; align-items:baseline; background:var(--mint); border-radius:14px; padding:12px 14px; margin-top:10px; }
  .photo-total .l{ font-size:12.5px; font-weight:800; color:var(--mint-ink); }
  .photo-total .v{ font-size:18px; font-weight:900; color:var(--mint-ink); }
  .photo-note{ font-size:12px; color:var(--ink-dim); margin-top:10px; line-height:1.45; }
  .photo-actions{ display:flex; gap:8px; margin-top:14px; }
  .photo-actions .btn{ flex:1; }

  /* ---- charts ---- */
  .chart-wrap svg{ width:100%; height:auto; display:block; }
  .chart-legend{ display:flex; gap:16px; margin-top:10px; font-size:11.5px; color:var(--ink-dim); flex-wrap:wrap; }
  .chart-legend span{ display:inline-flex; align-items:center; gap:5px; }
  .chart-legend i{ width:12px; height:3px; border-radius:2px; display:inline-block; }

  .hist-chart{ display:flex; align-items:flex-end; gap:7px; height:140px; position:relative; padding-top:10px; }
  .hist-chart .target-line{ position:absolute; left:0; right:0; border-top:1.5px dashed var(--ink-faint); opacity:.5; }
  .hist-col{ flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end; min-width:0; }
  .hist-bar{ width:100%; max-width:26px; border-radius:8px 8px 4px 4px; min-height:4px; display:block; }
  .hist-label{ font-size:9.5px; color:var(--ink-faint); font-weight:700; }

  .dot-grid{ display:flex; gap:7px; flex-wrap:wrap; margin-top:4px; }
  .dot-cell{ flex:1 1 30px; text-align:center; }
  .dot-cell .dot{ width:30px; height:30px; border-radius:10px; background:var(--surface-soft); margin:0 auto 5px; display:flex; align-items:center; justify-content:center; }
  .dot-cell .dot.done{ background:var(--primary); color:#fff; }
  .dot-cell .dot svg{ width:14px; height:14px; }
  .dot-cell .lbl{ font-size:9px; color:var(--ink-faint); font-weight:700; }

  .report-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .report-item{ background:var(--surface-soft); border-radius:16px; padding:12px 13px; }
  .report-item .l{ font-size:10.5px; color:var(--ink-dim); font-weight:800; text-transform:uppercase; letter-spacing:.02em; }
  .report-item .v{ font-size:16px; font-weight:800; margin-top:3px; color:var(--ink); }
  .report-item .v small{ font-size:11px; color:var(--ink-dim); font-weight:700; }

  /* ---- bottom nav ---- */
  nav.bottom{
    position:fixed; left:0; right:0; bottom:0; z-index:30;
    background:var(--surface); border-top:1px solid var(--line);
    padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));
    display:flex; justify-content:space-around;
  }
  nav.bottom button{ background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--ink-faint); cursor:pointer; padding:4px 6px; flex:1; }
  nav.bottom button svg{ width:22px; height:22px; }
  nav.bottom button span{ font-size:10px; font-weight:800; }
  nav.bottom button.active{ color:var(--primary); }

  .empty-note{ font-size:13px; color:var(--ink-dim); text-align:center; padding:6px 0; }
  .sync-note{ font-size:11.5px; color:var(--ink-faint); text-align:center; margin-top:4px; }

  @media (max-width:380px){
    .status-grid{ grid-template-columns:1fr; }
    .stat-grid{ grid-template-columns:1fr 1fr; }
    .report-grid{ grid-template-columns:1fr; }
  }
</style>

<div id="app">
  <main id="view"></main>
</div>
<nav class="bottom" id="bottomNav"></nav>

  // ---------- baseline report (Relaxmedic, 20/09/2026) ----------

  function computeFoodNutrients(food, qty){

  function computeTargets(s){
    var factor = (ACTIVITY[s.activityLevel]||ACTIVITY.leve).factor;
    var tdee = s.bmr * factor;
    var deficitPct = s.deficitPct==null ? 0.2 : s.deficitPct;
    var calorieTarget = Math.max(Math.round(s.bmr+100), Math.round(tdee*(1-deficitPct)));
    var weeklyLossKg = +(tdee*deficitPct*7/7700).toFixed(2);
    var proteinG = Math.round(PROTEIN_PER_KG_LEAN*(s.leanMassKg||LEAN_MASS_KG));
    var carbsG = CARB_CAP_G;
    var proteinKcal = proteinG*4, carbsKcal = carbsG*4;
    var fatKcal = Math.max(0, calorieTarget - proteinKcal - carbsKcal);
    var fatG = Math.round(fatKcal/9);
    return { tdee:Math.round(tdee), calorieTarget:calorieTarget, weeklyLossKg:weeklyLossKg, proteinG:proteinG, carbsG:carbsG, fatG:fatG };

  function computeTimeline(s, targets){

    var startDate = new Date(s.startDate+'T00:00:00');

  }
  function computeStatus(s, targets, currentWeightKg){
    var startDate = new Date(s.startDate+'T00:00:00');
    var weeksElapsed = Math.max(0, (Date.now()-startDate.getTime())/(7*86400000));
    var expected = s.startWeightKg - targets.weeklyLossKg*weeksElapsed;
    var diff = expected - currentWeightKg;
    var status='ok', label='No ritmo';
    if(weeksElapsed < 0.5){ status='neutral'; label='Início'; }
    else if(diff >= -0.3){ status='ok'; label='No ritmo'; }
    else if(diff >= -1.5){ status='warn'; label='Atenção'; }
    else { status='bad'; label='Abaixo do ritmo'; }
    return { status:status, label:label, weeksElapsed:weeksElapsed };
  }

    if(code==='invalid_json' || code==='empty_completion') return 'Não consegui ler o resultado. Tente tirar a foto de novo.';
    if(code==='rate_limited') return 'Muitas análises seguidas. Espere um pouco e tente de novo.';
    if(code==='session_expired') return 'Sua sessão expirou. Entre no Claude de novo.';
    return 'A análise falhou. Tente de novo em instantes.';
  }
  function resetPhoto(){
    if(state.photo.preview){ try{ URL.revokeObjectURL(state.photo.preview); }catch(e){} }
    state.photo = { status:'idle', preview:null, items:[], note:'', error:'' };
  }
  async function analyzePhoto(file){
    if(!sampleFn || !file) return;
    resetPhoto();
    state.photo = { status:'loading', preview:URL.createObjectURL(file), items:[], note:'', error:'' };
    renderAll();
    try{
      var res = await sampleFn.json(PHOTO_PROMPT, { images:[file] });
      var items = (res && Array.isArray(res.items) ? res.items : []).map(function(it){
        return { name:String(it.name||'Alimento'), portion:String(it.portion||''), kcal:Math.max(0,+it.kcal||0), p:Math.max(0,+it.p||0), c:Math.max(0,+it.c||0), g:Math.max(0,+it.g||0) };
      });
      state.photo.status = 'done';
      state.photo.items = items;
      state.photo.note = res && res.note ? String(res.note) : '';
    }catch(err){
      var code = err && err.code;
      if(code==='images_unavailable'){ state.photoAvailable = false; }
      state.photo.status = 'error';
      state.photo.error = photoErrorCopy(code);
    }
    renderAll();
  }
  async function initSample(){
    try{ if(window.claude && window.claude.use){ sampleFn = await window.claude.use('sample'); } }catch(e){ sampleFn = null; }
    var caps = sampleFn ? await sampleFn.limits().catch(function(){ return null; }) : null;
    state.photoAvailable = !!(caps && caps.images);
    if(caps && caps.images && caps.images.mediaTypes){ state.photoAccept = caps.images.mediaTypes.join(','); }
    renderAll();
  }

  function renderPhotoCard(){
    var ph = state.photo;
    var unavailable = state.photoAvailable===false;
    var total = ph.items.reduce(function(t,it){ t.kcal+=it.kcal; t.p+=it.p; t.c+=it.c; t.g+=it.g; return t; }, {kcal:0,p:0,c:0,g:0});
    var body = '';
    if(ph.preview){ body += '<img class="photo-preview" src="'+escAttr(ph.preview)+'" alt="Foto do prato">'; }
    if(ph.status==='loading'){ body += '<div class="photo-status">Analisando o prato…</div>'; }
    else if(ph.status==='error'){ body += '<div class="photo-status error">'+escHtml(ph.error)+'</div>'; }
    else if(ph.status==='done'){
      if(!ph.items.length){
        body += '<div class="photo-status">Nenhum alimento identificado.'+(ph.note?' '+escHtml(ph.note):'')+'</div>';
      } else {
        body += '<div class="photo-result">'
          + ph.items.map(function(it,idx){
              return '<div class="entry-row"><div><div class="name">'+escHtml(it.name)+'</div><div class="macros tabular">'+escHtml(it.portion)+' · '+fmt(it.p)+'g P · '+fmt(it.c)+'g C · '+fmt(it.g)+'g G</div></div>'
                + '<div class="right"><span class="tabular">'+fmt(it.kcal)+' kcal</span><button class="icon-btn" data-rm-photo-item="'+idx+'" aria-label="Remover '+escAttr(it.name)+'">✕</button></div></div>';
            }).join('')
          + '<div class="photo-total"><span class="l">Total estimado</span><span class="v tabular">'+fmt(total.kcal)+' kcal</span></div>'
          + (ph.note ? '<div class="photo-note">'+escHtml(ph.note)+'</div>' : '')
          + '<div class="photo-actions"><button class="btn ghost" id="photoDiscard">Descartar</button><button class="btn primary" id="photoAdd">Adicionar ao dia</button></div>'
          + '</div>';
      }
    }
    if(ph.status==='added'){ body += '<div class="photo-status">Adicionado aos itens de hoje.</div>'; }

    return '<div class="card">'
      + '<div class="card-title">Foto do prato</div>'
      + '<div class="sub">'+(unavailable ? 'A análise por foto não está disponível nesta visualização.' : 'Tire uma foto da refeição e a IA estima as calorias e os macros. Revise antes de adicionar.')+'</div>'
      + '<label class="photo-btn'+(unavailable||ph.status==='loading'?' disabled':'')+'" for="photoInput">'+ICON.camera+'<span>'+(ph.status==='loading'?'Analisando…':(ph.preview?'Tirar outra foto':'Tirar foto do prato'))+'</span></label>'
      + '<input class="photo-input" type="file" id="photoInput" accept="'+escAttr(state.photoAccept)+'" capture="environment"'+(unavailable?' disabled':'')+'>'
      + body
      + '</div>';
  }

  function latestWeightKg(){
    var keys = Object.keys(state.weights||{}).sort();
    if(keys.length) return state.weights[keys[keys.length-1]].weightKg;
    return (state.settings||DEFAULT_SETTINGS).startWeightKg;
  }

  // ---------- init ----------
  async function init(){
    initSample();
    try{ if(window.claude && window.claude.use){ db = await window.claude.use('db'); } }catch(err){ db = null; }
    state.dbAvailable = !!db;

    if(db){
      try{
        var settingsSnap = await db.doc('settings/profile').get();
        if(!settingsSnap.exists){ await db.doc('settings/profile').set(DEFAULT_SETTINGS); }
      }catch(e){ console.error(e); }
      try{
        var metaRef = db.doc('settings/meta');
        var metaSnap = await metaRef.get();
        var meta = metaSnap.exists ? metaSnap.data() : {};
        var patch = {};
        if((meta.planVersion||0) < PLAN_VERSION){
          for(var i=0;i<DEFAULT_PLAN.length;i++){ await db.collection('dietPlan').doc(DEFAULT_PLAN[i].id).set(DEFAULT_PLAN[i]); }
          patch.planVersion = PLAN_VERSION;
        }
        if((meta.workoutVersion||0) < WORKOUT_VERSION){
          for(var j=0;j<WORKOUT_PLAN.length;j++){ await db.collection('workoutPlan').doc(WORKOUT_PLAN[j].id).set(WORKOUT_PLAN[j]); }
          patch.workoutVersion = WORKOUT_VERSION;
        }
        if(Object.keys(patch).length){ await metaRef.set(Object.assign({}, meta, patch)); }
      }catch(e){ console.error(e); }

      unsubs.push(db.doc('settings/profile').onSnapshot(function(snap){ state.settings = snap.exists ? snap.data() : DEFAULT_SETTINGS; renderAll(); }, function(){ state.settings = DEFAULT_SETTINGS; renderAll(); }));
      unsubs.push(db.collection('dietPlan').onSnapshot(function(qs){ var plan={}; qs.docs.forEach(function(d){ plan[d.id]=d.data(); }); state.plan=plan; renderAll(); }, function(){ renderAll(); }));
      unsubs.push(db.collection('workoutPlan').onSnapshot(function(qs){ var w={}; qs.docs.forEach(function(d){ w[d.id]=d.data(); }); state.workout=w; renderAll(); }, function(){ renderAll(); }));
      unsubs.push(db.collection('weightLog').onSnapshot(function(qs){ var w={}; qs.docs.forEach(function(d){ w[d.id]=d.data(); }); state.weights=w; renderAll(); }, function(){ renderAll(); }));

      var date = todayStr();
      unsubs.push(db.doc('foodLog/'+date).collection('entries').onSnapshot(function(qs){ var e={}; qs.docs.forEach(function(d){ e[d.id]=d.data(); }); state.todayEntries=e; syncDailySummary(); renderAll(); }, function(){ renderAll(); }));
      unsubs.push(db.collection('dailySummary').orderBy('date','desc').limit(14).onSnapshot(function(qs){ var h=qs.docs.map(function(d){ return d.data(); }); h.reverse(); state.dailyHistory=h; renderAll(); }, function(){ renderAll(); }));
      unsubs.push(db.doc('workoutLog/'+date).onSnapshot(function(snap){ state.todayWorkout = snap.exists ? snap.data() : null; renderAll(); }, function(){ renderAll(); }));
      unsubs.push(db.collection('workoutLog').orderBy('date','desc').limit(14).onSnapshot(function(qs){ var h=qs.docs.map(function(d){ return d.data(); }); h.reverse(); state.workoutHistory=h; renderAll(); }, function(){ renderAll(); }));
    } else {
      mem.settings = Object.assign({}, DEFAULT_SETTINGS);
      mem.plan = {}; DEFAULT_PLAN.forEach(function(m){ mem.plan[m.id]=m; });
      mem.workout = {}; WORKOUT_PLAN.forEach(function(d){ mem.workout[d.id]=d; });
      state.settings = mem.settings; state.plan = mem.plan; state.workout = mem.workout;
    }
    renderAll();
  }

  // ---------- render ----------
  function renderAll(){
    if(!state.settings || !state.plan || !state.workout){ return; }
    var view = document.getElementById('view');
    if(state.tab==='inicio') view.innerHTML = renderInicio();
    else if(state.tab==='nutricao') view.innerHTML = renderNutricao();
    else if(state.tab==='treino') view.innerHTML = renderTreino();
    else if(state.tab==='graficos') view.innerHTML = renderGraficos();
    else view.innerHTML = renderPerfil();
    renderBottomNav();
    bindView();
  }

  function renderBottomNav(){
    var items = [
      {id:'inicio', label:'Início', icon:ICON.home},
      {id:'nutricao', label:'Nutrição', icon:ICON.fork},
      {id:'treino', label:'Treino', icon:ICON.dumbbell},
      {id:'graficos', label:'Gráficos', icon:ICON.chart},
      {id:'perfil', label:'Perfil', icon:ICON.user}
    ];
    document.getElementById('bottomNav').innerHTML = items.map(function(it){
      return '<button data-tab="'+it.id+'" class="'+(state.tab===it.id?'active':'')+'">'+it.icon+'<span>'+it.label+'</span></button>';
    }).join('');
  }

      +   '<div class="eyebrow">Meta de peso</div>'

      +     '<div class="chip"><div class="l">Calorias hoje</div><div class="v">'+fmt(consumed.kcal)+' <span>/ '+fmt(targets.calorieTarget)+'</span></div></div>'
      +     '<div class="chip"><div class="l">Peso atual</div><div class="v">'+fmt(currentW,1)+' <span>kg</span></div></div>'
      +   '</div>'
      + '</div>'

      + '<div class="section-title"><h2>Hoje</h2></div>'

      +     '<div class="title">Nutrição</div>'

      +   '</div>'
      +   '<div class="status-card">'

      +     '<div class="sub">'+(todayWorkoutDay&&todayWorkoutDay.exercises.length?todayWorkoutDay.exercises.length+' exercícios':'Dia de descanso')+'</div>'
      +     '<button class="more" data-goto="treino">Ver detalhes '+ICON.chev+'</button>'
      +   '</div>'
      + '</div>'

      + '<div class="section-title"><h2>Meus atalhos</h2></div>'
      + '<div class="shortcut-grid">'

  function macroBar(label, val, target, cls, color){
    var pct = clamp((val/(target||1))*100, 0, 100);
    return '<div class="macro-row"><span class="macro-dot" style="background:'+color+'"></span><span class="l">'+label+'</span><span class="v tabular">'+fmt(val)+' / '+fmt(target)+' g</span></div>'
      + '<div class="macro-track"><div class="macro-fill" style="width:'+pct.toFixed(1)+'%;background:'+color+'"></div></div>';
  }

  function foodPickerHtml(pickerId){

      + '<select class="food-select" data-food-select="'+escAttr(pickerId)+'"><option value="">Escolher alimento…</option>'+foodOptionsHtml()+'</select>'

  function renderNutricao(){
    var s = state.settings, targets = computeTargets(s);
    var consumed = computeTodayTotals();
    var pct = clamp(consumed.kcal/targets.calorieTarget, 0, 1.3);
    var over = consumed.kcal > targets.calorieTarget;
    var r = 52, circumference = 2*Math.PI*r;
    var dash = circumference*clamp(pct,0,1);

    var mealsHtml = Object.keys(state.plan).sort(function(a,b){ return (state.plan[a].order||0)-(state.plan[b].order||0); }).map(function(id){
      var meal = state.plan[id]; var t = mealTotals(meal);
      var entry = state.todayEntries ? state.todayEntries[id] : null;
      var st = entry ? entry.status : null;
      var expanded = state.expandedMeal===id;
      var itemsList = (meal.items||[]).map(function(it,idx){
        return '<div class="item-edit-row">'
          + '<input type="text" value="'+escAttr(it.food)+'" data-plan="'+escAttr(id)+'" data-idx="'+idx+'" data-field="food">'
          + '<input type="text" value="'+escAttr(it.qty)+'" data-plan="'+escAttr(id)+'" data-idx="'+idx+'" data-field="qty">'
          + '<input type="number" value="'+(it.kcal||0)+'" data-plan="'+escAttr(id)+'" data-idx="'+idx+'" data-field="kcal">'
          + '<input type="number" value="'+(it.p||0)+'" data-plan="'+escAttr(id)+'" data-idx="'+idx+'" data-field="p">'
          + '<input type="number" value="'+(it.c||0)+'" data-plan="'+escAttr(id)+'" data-idx="'+idx+'" data-field="c">'
          + '<input type="number" value="'+(it.g||0)+'" data-plan="'+escAttr(id)+'" data-idx="'+idx+'" data-field="g">'

        + '<div class="kcal tabular">'+fmt(t.kcal)+' kcal</div></div>'
        + '<div class="meal-actions">'

        +   '<button class="pill-btn eat'+(st==='eaten'?' active':'')+'" data-meal-status="'+escAttr(id)+'" data-status="eaten">'+ICON.check+'<span>Comi</span></button>'
        + '</div>'
        + '<button class="edit-link" data-toggle-edit="'+escAttr(id)+'">'+(expanded?'Fechar edição':'Editar refeição')+'</button>'

      +   '<div class="card-head"><div><div class="card-title">'+escHtml(todayDay?todayDay.muscle:'')+'</div><div class="sub" style="margin-bottom:0">'+(todayDay&&todayDay.exercises.length?todayDay.exercises.length+' exercícios hoje':'Hoje é dia de descanso')+'</div></div>'+pill(done?'ok':'neutral', done?'Concluído':'Pendente')+'</div>'
      +   (todayDay&&todayDay.note ? '<div class="day-note" style="margin-top:14px">'+escHtml(todayDay.note)+'</div>' : '')
      +   (todayDay&&todayDay.exercises.length ? ('<div class="exercise-list" style="margin-top:14px">'+todayDay.exercises.map(function(ex){ return '<div class="exercise-row"><span class="ex-name">'+escHtml(ex.name)+'</span><span class="ex-sets tabular">'+ex.sets+'x '+escHtml(String(ex.reps))+'</span></div>'; }).join('')+'</div>') : '')
      +   '<button class="btn block" style="margin-top:16px" id="toggleWorkoutDone">'+(done?'Desmarcar conclusão':'Marcar como concluído')+'</button>'
      + '</div>'

      + '<div class="card">'
      +   '<div class="card-title">Semana de treino</div>'
      +   '<div class="sub">Toque em um dia para ver ou editar os exercícios.</div>'
      +   daysHtml
      + '</div>';
  }

  function renderWeightChart(s, targets, timeline){
    var entries = Object.keys(state.weights||{}).map(function(k){ return state.weights[k]; }).sort(function(a,b){ return a.date.localeCompare(b.date); });
    var startDate = timeline.startDate, targetDate = timeline.targetDate;
    var maxDate = targetDate; if(entries.length){ var lastD = new Date(entries[entries.length-1].date+'T00:00:00'); if(lastD>maxDate) maxDate=lastD; }
    var today = new Date(); if(today>maxDate) maxDate=today;
    var totalMs = Math.max(1, maxDate-startDate);
    var weightVals = entries.map(function(e){ return e.weightKg; }).concat([s.startWeightKg, s.targetWeightKg]);
    var minW = Math.min.apply(null, weightVals)-2, maxW = Math.max.apply(null, weightVals)+2, spanW = Math.max(1, maxW-minW);
    var W=520,H=180,padL=30,padR=10,padT=10,padB=22;
    function x(d){ return padL + ((d-startDate)/totalMs)*(W-padL-padR); }
    function y(w){ return padT + (1-((w-minW)/spanW))*(H-padT-padB); }
    var baseline = H-padB;
    var gridLines='', gridLabels='';
    for(var i=0;i<=3;i++){ var wv=minW+(spanW/3)*i, yy=y(wv);
      gridLines += '<line x1="'+padL+'" y1="'+yy.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+yy.toFixed(1)+'" stroke="var(--line)" stroke-width="1"></line>';
      gridLabels += '<text x="2" y="'+(yy+3).toFixed(1)+'" font-size="9" fill="#9AA79B">'+wv.toFixed(0)+'</text>';
    }
    var goalPath = 'M '+x(startDate).toFixed(1)+' '+y(s.startWeightKg).toFixed(1)+' L '+x(targetDate).toFixed(1)+' '+y(s.targetWeightKg).toFixed(1);
    var actualPath='', areaPath='', dots='', firstX=null, lastX=null;
    entries.forEach(function(e,i){ var d=new Date(e.date+'T00:00:00'); var px=x(d), py=y(e.weightKg);
      if(firstX===null) firstX=px; lastX=px;
      actualPath += (i===0?'M ':'L ')+px.toFixed(1)+' '+py.toFixed(1)+' ';
      areaPath += (i===0?'M ':'L ')+px.toFixed(1)+' '+py.toFixed(1)+' ';
      dots += '<circle cx="'+px.toFixed(1)+'" cy="'+py.toFixed(1)+'" r="3.5" fill="var(--primary)"></circle>';
    });
    if(entries.length){ areaPath += 'L '+lastX.toFixed(1)+' '+baseline+' L '+firstX.toFixed(1)+' '+baseline+' Z'; }
    var todayX = x(today);
    return '<div class="chart-wrap"><svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'
      + '<defs><linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--primary)" stop-opacity="0.18"></stop><stop offset="100%" stop-color="var(--primary)" stop-opacity="0"></stop></linearGradient></defs>'
      + gridLines + gridLabels
      + (areaPath ? '<path d="'+areaPath.trim()+'" fill="url(#areaGrad)"></path>' : '')
      + '<line x1="'+todayX.toFixed(1)+'" y1="'+padT+'" x2="'+todayX.toFixed(1)+'" y2="'+(H-padB)+'" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 3"></line>'
      + '<path d="'+goalPath+'" fill="none" stroke="var(--amber)" stroke-width="2" stroke-dasharray="5 4" opacity="0.8"></path>'
      + (actualPath ? '<path d="'+actualPath.trim()+'" fill="none" stroke="var(--primary)" stroke-width="2.5"></path>' : '')
      + dots + '</svg></div>'
      + '<div class="chart-legend"><span><i style="background:var(--primary)"></i>Peso registrado</span><span><i style="background:var(--amber)"></i>Ritmo da meta</span></div>';
  }

  function renderHistoryChart(history, target){
    if(!history || !history.length){ return '<div class="empty-note">Sem histórico ainda.</div>'; }
    var maxVal = Math.max(target, history.reduce(function(m,h){return Math.max(m,h.kcal||0);},0))*1.15;
    var targetPct = clamp(target/maxVal*100,0,100);
    var cols = history.map(function(h){
      var pct = clamp((h.kcal||0)/maxVal*100,2,100);
      var ratio = (h.kcal||0)/(target||1);
      var st = (ratio>=0.85&&ratio<=1.15) ? 'var(--primary)' : (ratio<0.85 ? 'var(--amber)' : 'var(--red)');
      var d = new Date(h.date+'T00:00:00');
      return '<div class="hist-col"><div class="hist-bar" style="height:'+pct.toFixed(1)+'%;background:'+st+'"></div><div class="hist-label">'+d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+'</div></div>';
    }).join('');
    return '<div class="hist-chart"><div class="target-line" style="bottom:'+targetPct.toFixed(1)+'%"></div>'+cols+'</div>';
  }

  function renderGraficos(){
    var s = state.settings, targets = computeTargets(s);
    var timeline = computeTimeline(s, targets);
    var currentW = latestWeightKg();

    var last7 = [];
    for(var i=6;i>=0;i--){ var d=new Date(); d.setDate(d.getDate()-i); last7.push(d); }
    var dotsHtml = last7.map(function(d){
      var key = d.toLocaleDateString('sv-SE');
      var rec = (state.workoutHistory||[]).find(function(h){ return h.date===key; });
      var isDone = rec && rec.completed;
      var lbl = d.toLocaleDateString('pt-BR',{weekday:'short'}).slice(0,3);
      return '<div class="dot-cell"><div class="dot'+(isDone?' done':'')+'">'+(isDone?ICON.check:'')+'</div><div class="lbl">'+lbl+'</div></div>';
    }).join('');

    return ''
      + '<div class="greeting"><div><div class="hi">Evolução</div><h1 style="font-size:23px">Gráficos</h1></div></div>'

      + '<div class="card">'
      +   '<div class="card-title">Evolução de peso</div>'
      +   '<div class="sub">'+fmt(s.startWeightKg,1)+' kg → '+fmt(s.targetWeightKg,1)+' kg · atual '+fmt(currentW,1)+' kg</div>'
      +   renderWeightChart(s, targets, timeline)
      + '</div>'

      + '<div class="card">'
      +   '<div class="card-title">Histórico de calorias</div>'
      +   '<div class="sub">Últimos dias vs. meta de '+fmt(targets.calorieTarget)+' kcal.</div>'
      +   renderHistoryChart(state.dailyHistory, targets.calorieTarget)
      + '</div>'

      + '<div class="card">'
      +   '<div class="card-title">Consistência de treino</div>'
      +   '<div class="sub">Últimos 7 dias.</div>'
      +   '<div class="dot-grid">'+dotsHtml+'</div>'
      + '</div>';
  }

  function renderPerfil(){
    var s = state.settings, targets = computeTargets(s);
    var activityOpts = Object.keys(ACTIVITY).map(function(k){ return '<option value="'+k+'"'+(s.activityLevel===k?' selected':'')+'>'+ACTIVITY[k].label+'</option>'; }).join('');
    var deficitOpts = Object.keys(DEFICITS).map(function(k){ return '<option value="'+k+'"'+(Math.abs(s.deficitPct-DEFICITS[k].pct)<0.001?' selected':'')+'>'+DEFICITS[k].label+'</option>'; }).join('');

    return ''
      + '<div class="greeting"><div><div class="hi">Minha conta</div><h1 style="font-size:23px">Perfil</h1></div></div>'

      + '<div class="card">'
      +   '<div class="card-title">Relatório de bioimpedância</div>'
      +   '<div class="sub">'+REPORT.name+' · '+REPORT.sex+' · '+REPORT.age+' anos · '+REPORT.heightCm+' cm · '+REPORT.examDate+'</div>'
      +   '<div class="report-grid">'
      +     '<div class="report-item"><div class="l">Peso no exame</div><div class="v">'+fmt(REPORT.weightKg,1)+' <small>kg</small></div></div>'
      +     '<div class="report-item"><div class="l">Gordura corporal</div><div class="v">'+fmt(REPORT.bodyFatPct,1)+' <small>% · '+fmt(REPORT.bodyFatKg,1)+' kg</small></div></div>'
      +     '<div class="report-item"><div class="l">Massa magra</div><div class="v">'+fmt(LEAN_MASS_KG,1)+' <small>kg</small></div></div>'
      +     '<div class="report-item"><div class="l">IMC</div><div class="v">'+fmt(REPORT.imc,1)+' <small>kg/m²</small></div></div>'
      +     '<div class="report-item"><div class="l">TMB</div><div class="v">'+fmt(REPORT.bmr)+' <small>kcal/dia</small></div></div>'
      +     '<div class="report-item"><div class="l">Gordura visceral</div><div class="v">'+fmt(REPORT.visceralFat)+' <small>grau</small></div></div>'
      +   '</div>'
      + '</div>'

      + '<div class="card">'
      +   '<div class="card-title">Meus dados</div>'
      +   '<div class="field-row"><label for="p-start">Peso inicial (kg)</label><input type="number" id="p-start" step="0.1" value="'+s.startWeightKg+'"></div>'
      +   '<div class="field-row"><label for="p-target">Peso alvo (kg)</label><input type="number" id="p-target" step="0.1" value="'+s.targetWeightKg+'"></div>'
      +   '<div class="field-row"><label for="p-date">Início do acompanhamento</label><input type="text" id="p-date" value="'+s.startDate+'" placeholder="AAAA-MM-DD"></div>'
      +   '<div class="field-row"><label for="p-activity">Nível de atividade</label><select id="p-activity">'+activityOpts+'</select></div>'
      +   '<div class="field-row"><label for="p-deficit">Déficit calórico</label><select id="p-deficit">'+deficitOpts+'</select></div>'
      +   '<button class="btn primary block" id="saveProfileBtn">Salvar</button>'
      + '</div>'

      + '<div class="card">'
      +   '<div class="card-title">Suas metas calculadas</div>'
      +   '<div class="stat-grid">'
      +     '<div class="stat-tile"><div class="l">TDEE</div><div class="v">'+fmt(targets.tdee)+'</div></div>'
      +     '<div class="stat-tile"><div class="l">Meta kcal</div><div class="v">'+fmt(targets.calorieTarget)+'</div></div>'
      +     '<div class="stat-tile"><div class="l">Perda/sem</div><div class="v">-'+fmt(targets.weeklyLossKg,2)+'</div></div>'
      +   '</div>'
      +   '<div class="sub">Proteína: '+fmt(targets.proteinG)+' g · Carboidrato: até '+fmt(targets.carbsG)+' g · Gordura: '+fmt(targets.fatG)+' g por dia.</div>'
      + '</div>'
      + (state.dbAvailable===false ? '<div class="sync-note">Sincronização indisponível nesta visualização — dados salvos só nesta aba.</div>' : '');
  }

  // ---------- picker helpers ----------
  function onFoodSelectChange(pickerId){
    var sel = document.querySelector('[data-food-select="'+pickerId+'"]');
    var qtyInp = document.querySelector('[data-food-qty="'+pickerId+'"]');
    if(!sel || !qtyInp) return;
    var food = foodById(sel.value);
    if(food){ qtyInp.value = food.basis==='unit' ? 1 : 100; }
    updateFoodPickerPreview(pickerId);
  }
  function updateFoodPickerPreview(pickerId){
    var sel = document.querySelector('[data-food-select="'+pickerId+'"]');
    var qtyInp = document.querySelector('[data-food-qty="'+pickerId+'"]');
    var prevEl = document.getElementById('food-preview-'+pickerId);
    if(!sel || !qtyInp) return;
    var food = foodById(sel.value);
    if(!food){ if(prevEl) prevEl.textContent='—'; return; }
    var qty = parseFloat(qtyInp.value)||0;
    var n = computeFoodNutrients(food, qty);
    if(prevEl) prevEl.textContent = n ? ('≈ '+fmt(n.kcal)+' kcal') : '—';
  }

  // ---------- events ----------
  function bindView(){
    var view = document.getElementById('view');

    document.querySelectorAll('[data-goto]').forEach(function(btn){ btn.addEventListener('click', function(){ goTab(btn.getAttribute('data-goto')); }); });
    document.querySelectorAll('[data-tab]').forEach(function(btn){ btn.addEventListener('click', function(){ goTab(btn.getAttribute('data-tab')); }); });

    var quickWeight = document.querySelector('[data-quick-weight]');
    if(quickWeight){ quickWeight.addEventListener('click', function(){
      var v = window.prompt('Peso de hoje (kg):', state.weights[todayStr()] ? state.weights[todayStr()].weightKg : '');
      var n = parseFloat((v||'').replace(',','.'));
      if(!isNaN(n) && n>0) logWeight(n);
    }); }

    view.querySelectorAll('[data-meal-status]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-meal-status');
        var clickedStatus = btn.getAttribute('data-status');
        var entry = state.todayEntries ? state.todayEntries[id] : null;
        var current = entry ? entry.status : null;
        setMealStatus(state.plan[id], current===clickedStatus ? null : clickedStatus);
      });
    });
    view.querySelectorAll('[data-toggle-edit]').forEach(function(btn){
      btn.addEventListener('click', function(){ var id = btn.getAttribute('data-toggle-edit'); state.expandedMeal = state.expandedMeal===id ? null : id; renderAll(); });
    });
    view.querySelectorAll('[data-rm-entry]').forEach(function(btn){ btn.addEventListener('click', function(){ removeEntry(btn.getAttribute('data-rm-entry')); }); });

    view.querySelectorAll('input[data-plan]').forEach(function(inp){
      inp.addEventListener('change', function(){
        var mealId = inp.getAttribute('data-plan'), idx = +inp.getAttribute('data-idx'), field = inp.getAttribute('data-field');
        var meal = JSON.parse(JSON.stringify(state.plan[mealId]));
        meal.items[idx][field] = (field==='food'||field==='qty') ? inp.value : (parseFloat(inp.value)||0);
        saveMeal(meal);
      });
    });
    view.querySelectorAll('[data-rm-item]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var mealId = btn.getAttribute('data-rm-item'), idx = +btn.getAttribute('data-idx');
        var meal = JSON.parse(JSON.stringify(state.plan[mealId])); meal.items.splice(idx,1); saveMeal(meal);
      });
    });

    view.querySelectorAll('[data-food-select]').forEach(function(sel){ sel.addEventListener('change', function(){ onFoodSelectChange(sel.getAttribute('data-food-select')); }); });
    view.querySelectorAll('[data-food-qty]').forEach(function(inp){ inp.addEventListener('input', function(){ updateFoodPickerPreview(inp.getAttribute('data-food-qty')); }); });
    view.querySelectorAll('[data-add-food]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var pickerId = btn.getAttribute('data-add-food');
        var sel = view.querySelector('[data-food-select="'+pickerId+'"]');
        var qtyInp = view.querySelector('[data-food-qty="'+pickerId+'"]');
        if(!sel || !qtyInp) return;
        var food = foodById(sel.value); var qty = parseFloat(qtyInp.value)||0;
        if(!food || qty<=0) return;
        var n = computeFoodNutrients(food, qty);
        var qtyLabel = food.basis==='unit' ? (qty+' '+(food.unitLabel||'unid')) : (qty+' g');
        if(pickerId==='avulso'){ addCustomEntry({ name:food.name, kcal:n.kcal, p:n.p, c:n.c, g:n.g }); }
        else { var meal = JSON.parse(JSON.stringify(state.plan[pickerId])); meal.items = meal.items||[]; meal.items.push({ food:food.name, qty:qtyLabel, kcal:n.kcal, p:n.p, c:n.c, g:n.g }); saveMeal(meal); }
        sel.value=''; qtyInp.value=100; updateFoodPickerPreview(pickerId);
      });
    });

    var photoInput = document.getElementById('photoInput');
    if(photoInput){
      photoInput.addEventListener('change', function(){
        var file = photoInput.files && photoInput.files[0];
        if(file) analyzePhoto(file);
      });
    }
    view.querySelectorAll('[data-rm-photo-item]').forEach(function(btn){
      btn.addEventListener('click', function(){ state.photo.items.splice(+btn.getAttribute('data-rm-photo-item'),1); renderAll(); });
    });
    var photoDiscard = document.getElementById('photoDiscard');
    if(photoDiscard){ photoDiscard.addEventListener('click', function(){ resetPhoto(); renderAll(); }); }
    var photoAdd = document.getElementById('photoAdd');
    if(photoAdd){
      photoAdd.addEventListener('click', function(){
        var items = state.photo.items.slice();
        resetPhoto();
        state.photo.status = 'added';
        items.forEach(function(it){
          addCustomEntry({ name:it.name+(it.portion?' ('+it.portion+')':''), kcal:it.kcal, p:it.p, c:it.c, g:it.g });
        });
        renderAll();
      });
    }

    view.querySelectorAll('[data-toggle-day]').forEach(function(row){
      row.addEventListener('click', function(){ var id = row.getAttribute('data-toggle-day'); state.expandedDay = state.expandedDay===id ? null : id; renderAll(); });
    });
    view.querySelectorAll('input[data-wplan]').forEach(function(inp){
      inp.addEventListener('change', function(){
        var dayId = inp.getAttribute('data-wplan'), idx = +inp.getAttribute('data-idx'), field = inp.getAttribute('data-field');
        var day = JSON.parse(JSON.stringify(state.workout[dayId]));
        day.exercises[idx][field] = field==='name' ? inp.value : (field==='sets' ? (parseInt(inp.value)||0) : inp.value);
        saveWorkoutDay(day);
      });
    });
    view.querySelectorAll('[data-rm-ex]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var dayId = btn.getAttribute('data-rm-ex'), idx = +btn.getAttribute('data-idx');
        var day = JSON.parse(JSON.stringify(state.workout[dayId])); day.exercises.splice(idx,1); saveWorkoutDay(day);
      });
    });
    view.querySelectorAll('[data-add-ex]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var dayId = btn.getAttribute('data-add-ex');
        var day = JSON.parse(JSON.stringify(state.workout[dayId])); day.exercises = day.exercises||[];
        day.exercises.push({name:'Novo exercício', sets:3, reps:'12'}); saveWorkoutDay(day);
      });
    });
    var toggleWorkoutDone = document.getElementById('toggleWorkoutDone');
    if(toggleWorkoutDone){ toggleWorkoutDone.addEventListener('click', function(){ setWorkoutDone(weekdayKey(new Date()), !(state.todayWorkout && state.todayWorkout.completed)); }); }

    var saveProfileBtn = document.getElementById('saveProfileBtn');
    if(saveProfileBtn){
      saveProfileBtn.addEventListener('click', function(){
        var startW = parseFloat(document.getElementById('p-start').value);
        var targetW = parseFloat(document.getElementById('p-target').value);
        var date = document.getElementById('p-date').value.trim();
        var activity = document.getElementById('p-activity').value;
        var deficitKey = document.getElementById('p-deficit').value;
        saveSettings({
          startWeightKg: isNaN(startW) ? state.settings.startWeightKg : startW,
          targetWeightKg: isNaN(targetW) ? state.settings.targetWeightKg : targetW,
          startDate: /^\d{4}-\d{2}-\d{2}$/.test(date) ? date : state.settings.startDate,
          activityLevel: ACTIVITY[activity] ? activity : state.settings.activityLevel,
          deficitPct: DEFICITS[deficitKey] ? DEFICITS[deficitKey].pct : state.settings.deficitPct
        });
      });
    }
  }

  init();
})();
</script>
