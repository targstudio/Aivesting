# Baixa os indicadores (P/VP, P/L, dividendos, vacância...) de todas as ações e FIIs no Fundamentus e o embalo de
# preço dos mais baratos e o consenso dos analistas no Yahoo, e grava em api/data/curto_prazo.json e consenso.json (cópia inicial da tela Curto prazo; a API
# também se atualiza sozinha). Roda nos dias úteis depois do pregão, sob demanda e em PRs que mudam a varredura.
name: Atualizar curto prazo

on:
  workflow_dispatch:
  schedule:
    - cron: "30 22 * * 1-5"
  pull_request:
    paths:
      - api/app/trader.py
      - api/scripts/fetch_trader.py
      - api/app/consensus.py
      - api/scripts/fetch_consensus.py
      - .github/workflows/trader-data.yml

permissions:
  contents: write

concurrency:
  group: trader-data-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Baixar indicadores e preços
        run: python scripts/fetch_trader.py
      - name: Baixar a opinião dos analistas (consenso de bancos e corretoras)
        # Não derruba o resto se o Yahoo recusar: a API tenta de novo sozinha.
        continue-on-error: true
        run: python scripts/fetch_consensus.py
      - name: Gravar no branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898338+github-actions[bot]@users.noreply.github.com"
          git add data/curto_prazo.json
          [ -f data/consenso.json ] && git add data/consenso.json
          if git diff --cached --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "Atualiza os dados do curto prazo e do consenso"
            git pull --rebase
            git push
          fi
