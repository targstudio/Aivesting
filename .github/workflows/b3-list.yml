# Baixa o arquivo oficial de cotações da B3 (COTAHIST) e grava a lista completa de ações, FIIs, ETFs, BDRs e
# units em api/data/b3_listados.json (cópia inicial da API, que também se atualiza sozinha). Roda toda segunda à
# noite, sob demanda e em PRs que mudam a lista.
name: Atualizar lista da B3

on:
  workflow_dispatch:
  schedule:
    - cron: "30 23 * * 1"
  pull_request:
    paths:
      - api/app/catalog.py
      - api/scripts/fetch_b3_list.py
      - .github/workflows/b3-list.yml

permissions:
  contents: write

concurrency:
  group: b3-list-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Baixar lista da B3
        run: python scripts/fetch_b3_list.py
      - name: Gravar no branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898338+github-actions[bot]@users.noreply.github.com"
          git add data/b3_listados.json
          if git diff --cached --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "Atualiza a lista de ativos da B3"
            git pull --rebase
            git push
          fi
