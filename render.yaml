# Blueprint do Render para a API. No Render: New > Blueprint > escolha o repositório Aivesting.
services:
  - type: web
    name: aivesting-api
    runtime: python
    rootDir: api
    region: ohio
    # O plano gratuito "dorme" após 15 min sem tráfego: um ping externo em /health a cada 5 min
    # (ex.: cron-job.org) o mantém acordado. Troque para "starter" para não depender do ping.
    plan: free
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # "yahoo" é gratuito (uso não comercial); "brapi" exige token e plano pago para o universo todo.
      - key: DATA_PROVIDER
        value: yahoo
      - key: RANKING_INTERVAL_MINUTES
        value: "5"
      - key: AI_REQUESTS_PER_HOUR
        value: "30"
      # Modo assessor (sugestões de alocação por perfil): "public" ou "off".
      - key: ADVISOR_MODE
        value: public
      - key: ADMIN_TOKEN
        generateValue: true
      - key: BRAPI_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      # Domínio do site na Vercel, ex.: https://aivesting.vercel.app
      - key: WEB_ORIGIN
        sync: false
